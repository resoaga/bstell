<div class="item-actions">
  <span class="status-badge status-{{ order.status.value }}">{{ status_labels[order.status] }}</span>
  {% if order.status in next_status %}
  <form hx-post="/admin/orders/{{ order.id }}/advance" hx-target="#order-actions-{{ order.id }}"
        hx-swap="innerHTML" class="inline">
    <button type="submit" class="ord-next">{{ next_status_label[order.status] }}</button>
  </form>
  {% endif %}
  {% if order.status.value not in ("completed", "cancelled") %}
  <details class="cancel-box">
    <summary class="danger small">Stornieren</summary>
    <form hx-post="/admin/orders/{{ order.id }}/cancel" hx-target="#order-actions-{{ order.id }}" hx-swap="innerHTML">
      <select name="preset" aria-label="Grund wählen">
        <option value="">Grund wählen …</option>
        {% for reason in cancel_reasons %}<option>{{ reason }}</option>{% endfor %}
      </select>
      <input type="text" name="custom" placeholder="oder eigener Text" maxlength="200">
      {% if order.payment_method == "online" %}<p class="hint">Online bezahlt: Rückerstattung bitte im Payrexx-Dashboard auslösen.</p>{% endif %}
      <button type="submit" class="danger">Jetzt stornieren</button>
    </form>
  </details>
  {% endif %}
</div>
