{% extends "base.html" %}
{% block content %}
<h2>Einstellungen</h2>
{% include "admin/_settings_nav.html" %}

{% for page in pages %}
<section class="category">
  <h2>{{ page.title }}</h2>
  <form method="post" action="/admin/settings/legal/{{ page.slug }}">
    <label>Titel
      <input type="text" name="title" value="{{ page.title }}">
    </label>
    <label>Text
      <textarea name="body" rows="10">{{ page.body }}</textarea>
    </label>
    <button type="submit">Speichern</button>
  </form>
</section>
{% endfor %}
{% endblock %}
