{% extends "base.html" %}
{% block content %}
<h2>Einstellungen</h2>
{% include "admin/_settings_nav.html" %}

<section class="category">
  <h2>Bestellannahme</h2>
  <form method="post" action="/admin/settings/ordering">
    <label class="checkbox-label">
      <input type="checkbox" name="accepting_orders" value="true" {{ "checked" if settings.accepting_orders else "" }}>
      Bestellungen werden angenommen
    </label>
    <p class="hint">Wenn deaktiviert, gilt das für alle Bestellwege — sozusagen "Laden ist geschlossen".</p>
    <label class="checkbox-label">
      <input type="checkbox" name="pickup_enabled" value="true" {{ "checked" if settings.pickup_enabled else "" }}>
      Abholung möglich
    </label>
    <label class="checkbox-label">
      <input type="checkbox" name="delivery_enabled" value="true" {{ "checked" if settings.delivery_enabled else "" }}>
      Lieferung möglich
    </label>
    <label>Mindestbestellwert (CHF)
      <input type="number" step="0.05" min="0" name="minimum_order_value" value="{{ settings.minimum_order_value }}">
    </label>
    <label>Lieferkosten (CHF)
      <input type="number" step="0.05" min="0" name="delivery_fee" value="{{ settings.delivery_fee }}">
    </label>
    <button type="submit">Speichern</button>
  </form>
</section>
{% endblock %}
