<button
  class="sold-out-btn {{ 'is-sold-out' if not item.is_available else '' }}"
  hx-post="/admin/items/{{ item.id }}/toggle"
  hx-swap="outerHTML"
>
  {% if item.temp_sold_out %}Aus bis {{ item.sold_out_until.strftime('%H:%M') }} · freigeben{% elif item.is_available %}Ausverkauft{% else %}Wieder verfügbar{% endif %}
</button>
