<button
  class="sold-out-btn {{ 'is-sold-out' if not item.is_available else '' }}"
  hx-post="/admin/items/{{ item.id }}/toggle"
  hx-swap="outerHTML"
>
  {% if item.temp_sold_out %}Ausverkauft bis {{ item.sold_out_until.strftime('%H:%M') }} – jetzt freigeben{% elif item.is_available %}Als ausverkauft markieren{% else %}Wieder verfügbar machen{% endif %}
</button>
